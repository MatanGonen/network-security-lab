        set ip 192.168.60.1 255.255.255.0
        set allowaccess ping
        set type physical
        set description "EVE-NG-Management"
        set alias "LAN"
        set device-identification enable
        set lldp-transmission enable
        set role lan
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.0.18 255.255.255.252
        set allowaccess ping
        set type physical
        set alias "WAN"
        set lldp-reception enable
        set role wan
        set snmp-index 2
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.230.101 255.255.255.0
        set allowaccess ping https ssh http
        set type physical
        set description "EVE-NG-Management"
        set alias "MGMT"
        set snmp-index 3
    next
    edit "naf.root"
        set vdom "root"
        set type tunnel
        set src-check disable
        set alias "TO_FORTI_1"
        set snmp-index 5
    next
    edit "l2t.root"
        set vdom "root"
        set type tunnel
        set snmp-index 6
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
        set alias "SSL VPN interface"
        set snmp-index 7
    next
    edit "fortilink"
        set vdom "root"
        set fortilink enable
        set ip 10.255.1.1 255.255.255.0
        set allowaccess ping fabric
        set type aggregate
        set lldp-reception enable
        set lldp-transmission enable
        set snmp-index 8
    next
    edit "to_Forti1"
        set vdom "root"
        set type tunnel
        set snmp-index 4
        set interface "port2"
    next
    edit "to_PA_HQ_VPN"
        set vdom "root"
        set type tunnel
        set snmp-index 9
        set interface "port2"
    next
end
